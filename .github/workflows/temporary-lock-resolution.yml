name: One-time dependency lock resolution
on:
  push:
    branches:
      - fix/encrypted-session-restore-and-channel-ux
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependency lock for selected Flutter SDK
        run: flutter pub get
      - name: Commit SDK-resolved lockfile to current feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo 'Lockfile already reproducible'
          else
            git commit -m 'build(deps): pin flutter_secure_storage dependency graph'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock-${{ github.run_number }}
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1
