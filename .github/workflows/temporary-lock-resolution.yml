name: One-time dependency lock resolution
on:
  push:
    branches:
      - fix/encrypted-session-restore-and-channel-ux
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependency lock for selected Flutter SDK
        run: flutter pub get
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock-${{ github.run_number }}
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1
